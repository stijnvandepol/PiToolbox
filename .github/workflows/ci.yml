# Draait bij elke push en pull request dezelfde controles als scripts/gates.sh (CODE_GUIDELINES.md).
# Acties staan vast op een commit-SHA (supply chain); de tag staat erachter als commentaar.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.1"
          python-version: "3.14"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - run: uv sync --frozen
      - run: scripts/gates.sh
