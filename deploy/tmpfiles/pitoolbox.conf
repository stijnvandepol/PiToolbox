# pitoolbox (fase 5): beleid voor de capture-map van de service.
# Installeren als /etc/tmpfiles.d/pitoolbox.conf (install.sh --onderweg).
#
# Bron: tmpfiles.d(5) van systemd 262 (lokaal: `man tmpfiles.d`).
#  - Type d: "Create a directory. The mode and ownership will be adjusted if specified. Contents
#    of this directory are subject to time-based cleanup if the age argument is specified."
#  - Leeftijd "-" = geen opruiming. systemd-tmpfiles-clean.timer ruimt alleen op bij een leeftijd.
#
# Beleid: captures (pcap's van capture_start) worden standaard NOOIT automatisch verwijderd. Het
# zijn je eigen meetgegevens, en stil weggooien is erger dan een volle schijf. `status` toont de
# vrije schijfruimte, en ruim op met de hand. logrotate is hier niet geschikt: dat roteert
# losse logbestanden, geen map met sessiemappen, en een pcap halverwege een capture hernoemen
# breekt airodump-ng.
# Deze regel zorgt er alleen voor dat de map bij elke boot bestaat met 0700 pitoolbox:pitoolbox
# (zoals install.sh hem aanmaakt).
#
# Wil je toch automatisch opruimen, vervang dan de laatste "-" door een leeftijd, bijvoorbeeld
# 30d. Wat 30 dagen niet is gelezen of gewijzigd, wordt dan dagelijks verwijderd (atime, mtime en
# ctime tellen mee, zie "Age" in de man-page). Zet nooit een leeftijd op /var/lib/pitoolbox zelf:
# daar staan de auth-database en de audit-log.

#Type Path                         Mode User      Group     Age
d     /var/lib/pitoolbox/captures  0700 pitoolbox pitoolbox -
