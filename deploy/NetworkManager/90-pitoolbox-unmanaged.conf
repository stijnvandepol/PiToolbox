# pitoolbox (fase 5): NetworkManager blijft van de Alfa af, zodat hij monitor mode niet
# terugzet en geen scans/verbindingen start tijdens een capture.
# Installeren als /etc/NetworkManager/conf.d/90-pitoolbox-unmanaged.conf (install.sh --onderweg).
#
# Bron: NetworkManager.conf(5) van NetworkManager 1.58.1 (lokaal: `man NetworkManager.conf`):
#  - [keyfile] unmanaged-devices: "Set devices that should be ignored by NetworkManager". Zo'n
#    device is "strictly unmanaged" en kan niet via `nmcli device set ... managed yes` worden
#    teruggezet. Dat willen we hier: per ongeluk weer managed zetten mag niet kunnen.
#  - "Device List Format": `driver:DRIVER` matcht de driver zoals `nmcli -f GENERAL.DRIVER device
#    show` die meldt (op de Pi: mt7921u voor wlan1, brcmfmac voor wlan0).
#  - `key+=waarde` voegt toe aan een lijst die een eerder bestand al zette, in plaats van die te
#    overschrijven ("append a value to a previously-set list-valued key"). Getest met
#    `NetworkManager --print-config --config-dir=<map>` (NM 1.58.1).
#  - De keyfile-plugin is altijd actief, ook naast ifupdown (Kali: plugins=ifupdown,keyfile).
#
# Waarom op driver en niet op `interface-name:wlan1`: als de interfacenamen ooit verwisseld
# zouden raken, zou interface-name:wlan1 de UPLINK unmanaged maken en ben je onderweg je netwerk
# kwijt. Met driver:mt7921u blijft de ingebouwde wifi (brcmfmac) altijd managed, wat de naam ook is.
#
# Activeren: herstart van NetworkManager of de Pi (docs/fase5-onderweg.md). Controle:
#   NetworkManager --print-config | grep unmanaged-devices
#   nmcli -f GENERAL.DEVICE,GENERAL.DRIVER,GENERAL.STATE device show wlan1   # 10 (unmanaged)

[keyfile]
unmanaged-devices+=driver:mt7921u
